name: outage-postmortem
topic: >-
  Whether Tuesday's 40-minute production outage should be pinned on the engineer
  who was on call, or treated as a tooling problem with how we page people. The
  room is deciding who owns the failure before tomorrow's postmortem. A positive
  stance means holding the on-call engineer responsible; a negative stance means
  calling it a systems failure instead.
seedMessage: >-
  Postmortem for Tuesday's 40-minute outage is on the calendar tomorrow. The
  outage is behind us -- what I need going in is a clear read on where the
  failure actually was. Should this be pinned on the engineer who was on call,
  or is this really a problem with how we page people? Post where you land, and
  why.
maxRuntimeMs: 30000
maxToolStepsPerTurn: 6
budget:
  maxTotalTokens: 2000000
