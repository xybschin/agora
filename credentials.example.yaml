# Copy this to credentials.yaml (gitignored) and fill in real values --
# or, if you're using the self-hosted Matrix stack (Synapse, recommended),
# use the bootstrap script, which generates matrixSetupAccessToken /
# matrixSetupUserId / each agent's matrixUserId + matrixAccessToken for you
# and writes credentials.yaml directly. You'd still need to fill in each
# agent's llmApiKey by hand afterward.
#
# Static, per-agent credentials -- kept separate from scenario files so
# scenarios stay secret-free and shareable (Q23).
#
# matrixSetupUserId: the account the setup token belongs to. It creates each
#   Run's room and admits the agents to it, so the Run has an owner rather
#   than a room the agents wandered into.
# matrixSetupAccessToken: that same account's access token, which can create
#   rooms, invite accounts, and post the seed message. Populated by the
#   bootstrap script. The runner needs it because every Run creates its own
#   room -- there is deliberately no room id here: a Run's room is created
#   and populated at run time, so a second Run of this scenario starts in a
#   room with no history from the first.
#
# matrixAdmin (optional): a server-admin account, used only by
#   `reclaim --room` to find and delete a Run's room through Synapse's admin
#   API (ADR-0009). Never passed to any container. Bootstrap writes it when
#   run with SYNAPSE_REGISTRATION_SHARED_SECRET set; leave it out if you never
#   reclaim rooms.
#
# Readers: nothing to put here. A Reader is a human a scenario names in its
#   `observers` list so they can watch a Run live, and inviting one takes a
#   Matrix user id and nothing else -- there is no token for this file to
#   hold, and the runner does not need one to admit them.
#
# matrix: where Matrix lives, from both sides of the docker boundary.
#   hostBaseUrl -- how the host-side runner reaches it, e.g.
#     http://localhost:8000 (through the nginx gateway) or the Synapse port.
#   containerBaseUrl -- how the mcp_server container reaches it. The two
#     differ only on the self-hosted stack, where the container reaches
#     Synapse by DNS name over the agora_infra network declared in
#     docker-compose.infra.yml. A hosted homeserver has no such split, so
#     give both the public URL.
#
# llmBaseUrl/llmApiKey/llmModel point at an OpenAI-compatible
# /chat/completions endpoint. OpenRouter is a convenient way to get several
# model families (Q12) behind one endpoint without writing per-provider
# adapters -- swap in a local Ollama/vLLM URL for a free/local slot.

matrixSetupUserId: "@agora-setup:localhost"
matrixSetupAccessToken: "PUT_SETUP_ACCESS_TOKEN_HERE"
# matrixAdmin:
#   userId: "@agora-admin:localhost"
#   accessToken: "PUT_ADMIN_ACCESS_TOKEN_HERE"
matrix:
  hostBaseUrl: "http://localhost:8000"
  containerBaseUrl: "http://synapse:8008"
agents:
  alex:
    matrixUserId: "@alex:localhost"
    matrixAccessToken: "PUT_ALEX_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "openai/gpt-4o-mini"
  bri:
    matrixUserId: "@bri:localhost"
    matrixAccessToken: "PUT_BRI_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "openai/gpt-4o-mini"
  casey:
    matrixUserId: "@casey:localhost"
    matrixAccessToken: "PUT_CASEY_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "anthropic/claude-3.5-haiku"
  devon:
    matrixUserId: "@devon:localhost"
    matrixAccessToken: "PUT_DEVON_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "anthropic/claude-3.5-haiku"
  eli:
    matrixUserId: "@eli:localhost"
    matrixAccessToken: "PUT_ELI_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "meta-llama/llama-3.1-8b-instruct"
  fara:
    matrixUserId: "@fara:localhost"
    matrixAccessToken: "PUT_FARA_ACCESS_TOKEN_HERE"
    llmBaseUrl: "https://openrouter.ai/api/v1"
    llmApiKey: "PUT_OPENROUTER_KEY_HERE"
    llmModel: "meta-llama/llama-3.1-8b-instruct"
