# Persistent Matrix infrastructure shared by every Run: Synapse (the
# homeserver, :8008), its PostgreSQL database, and Element Web (:8009) for
# Readers to watch a Run's room. Start it once with `bun run setup:matrix`;
# Runs come and go on top of it. The `agora_infra` network has a fixed name
# because each Run's generated compose file joins its agent, mcp_server and
# Moderator containers to it to reach Synapse by container DNS.
services:
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    networks: [agora_infra]
    ports:
      - 8008:8008
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
      - UID=991
      - GID=991
    volumes:
      - ./docker/matrix/synapse:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [agora_infra]
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/matrix/postgres-data:/var/lib/postgresql/data

  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
    networks: [agora_infra]
    ports:
      - "0.0.0.0:8009:80"
    volumes:
      - ./docker/matrix/element-web/element-web-config.json:/app/config.json:ro

networks:
  agora_infra:
    name: agora_infra